<!doctype html>
<!--
  Launch ad for an AI-game hosting app. 32s, 1920x1080, cut on a 120 BPM grid.
  Every pixel is a pure function of time: seek(t). No CSS transitions, no timers, no state between frames.
  Open in a browser to preview (?t=12.3 freezes a moment); scripts/render.mjs drives seek(t) for export.
  Change the app name in BRAND below.
-->
<html>
<head>
<meta charset="utf-8" />
<title>app ad</title>
<style>
  @font-face { font-family: 'Inter'; src: url(assets/fonts/inter.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url(assets/fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; font-display: block; }
  :root { --v: #7c5cff; --p: #ff4fd8; --l: #c6ff3d; --c: #3de0ff; --bg: #07060d; --card: #121022; --line: rgba(255,255,255,0.09); }
  html, body { margin: 0; background: #000; }
  body.preview { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.preview #stage { transform: scale(var(--fit, 0.5)); transform-origin: center; flex: none; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #fff;
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--l); }
  .h1 { font-size: 92px; font-weight: 800; letter-spacing: -3.5px; line-height: 0.98; }
  .sub { font-size: 26px; line-height: 1.4; color: rgba(255,255,255,0.62); font-weight: 450; }
  .word { display: inline-block; white-space: pre; }
  .mask { overflow: hidden; padding-bottom: 0.08em; }
  .grad { background: linear-gradient(92deg, var(--v), var(--p) 55%, #ffb36b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: linear-gradient(180deg, rgba(30,26,54,0.92), rgba(16,14,30,0.94)); border: 1px solid var(--line); border-radius: 26px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06); }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-size: 19px; font-weight: 600;
    background: rgba(255,255,255,0.06); border: 1px solid var(--line); white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; font-size: 14px; font-weight: 650;
    background: rgba(124,92,255,0.18); border: 1px solid rgba(124,92,255,0.45); color: #d9d0ff; white-space: nowrap; }
  .spark { width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(135deg, var(--p), var(--v)); transform: rotate(45deg); display: inline-block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .phone { position: absolute; border-radius: 58px; background: #0b0a14; border: 10px solid #1d1a2e; overflow: hidden;
    box-shadow: 0 60px 140px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08), 0 0 120px rgba(124,92,255,0.18); }
  .notch { position: absolute; left: 50%; top: 14px; width: 120px; height: 32px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 5; }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 23px; line-height: 1.7; white-space: pre; }
  .tk-k { color: #ff7ad9; } .tk-s { color: #c6ff3d; } .tk-v { color: #7fdcff; } .tk-c { color: rgba(255,255,255,0.35); }
  canvas { display: block; }
  #vignette { inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, transparent 55%, rgba(0,0,0,0.7) 100%); pointer-events: none; }
  #grain { inset: 0; opacity: 0.06; mix-blend-mode: screen; pointer-events: none; }
  #flash { inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="abs" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <div class="abs" id="vignette"></div>
  <svg class="abs" id="grain" width="1920" height="1080"><filter id="noise"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
  <div class="abs" id="flash"></div>
</div>

<script src="../game-clips/games.js"></script>
<script>
// ---------- brand ----------
const BRAND = 'Promptcade'
const TAGLINE = 'The home for AI-made games.'

// ---------- time ----------
const W = 1920, H = 1080
const BPM = 120, B = 60 / BPM
const DUR = 64 * B // 32s
const b = (n) => n * B

// ---------- math ----------
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x))
const lerp = (a, c, p) => a + (c - a) * p
const smooth = (a, c, x) => { const t = clamp((x - a) / (c - a)); return t * t * (3 - 2 * t) }
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3)
const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t)))
const easeInOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 }
function S(t, f, z) { // damped spring step response 0 -> 1
  if (t <= 0) return 0
  const w = 2 * Math.PI * f
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)
  const wd = w * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t))
}
const pop = (t, f = 3.2) => S(t, f, 0.55) // overshooting entrance
const pulse = (t, f) => { if (t <= 0) return 0; const x = 2 * Math.PI * f * t; return x * Math.exp(1 - x) }
function rng(seed) { return () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }

// ---------- DOM helpers ----------
const $ = (id) => document.getElementById(id)
function el(tag, cls, style, parent, html) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (style) Object.assign(e.style, style)
  if (html != null) e.innerHTML = html
  if (parent) parent.appendChild(e)
  return e
}
function show(e, v, blur = 0, dy = 0, scale = 1) {
  v = clamp(v)
  e.style.opacity = v.toFixed(4)
  e.style.visibility = v < 0.002 ? 'hidden' : 'visible'
  const bl = (1 - v) * blur
  e.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none'
  const tf = []
  if (dy) tf.push(`translateY(${((1 - v) * dy).toFixed(2)}px)`)
  if (scale !== 1) tf.push(`scale(${lerp(scale, 1, v).toFixed(4)})`)
  e.style.transform = tf.join(' ')
}
const px = (n) => n.toFixed(2) + 'px'

// kinetic headline: words rise out of masks, staggered
function headline(parent, x, y, w, kicker, title, sub, align = 'left') {
  const root = el('div', 'abs', { left: x + 'px', top: y + 'px', width: w + 'px', textAlign: align }, parent)
  const k = el('div', 'kicker', { marginBottom: '22px' }, root, kicker)
  const h = el('div', 'h1', {}, root)
  const words = []
  title.split(/(?<=\s)/).forEach((wd) => {
    const m = el('span', 'mask', { display: 'inline-block', verticalAlign: 'top' }, h)
    const grad = wd.startsWith('*')
    words.push(el('span', 'word' + (grad ? ' grad' : ''), {}, m, wd.replace(/\*/g, '')))
  })
  const s = sub ? el('div', 'sub', { marginTop: '26px', maxWidth: w - 20 + 'px', display: align === 'center' ? 'inline-block' : 'block' }, root, sub) : null
  return (lt) => {
    show(k, smooth(0, 0.35, lt), 6, 10)
    words.forEach((wd, i) => {
      const p = easeOutExpo((lt - 0.08 - i * 0.07) / 0.6)
      wd.style.transform = `translateY(${((1 - p) * 105).toFixed(2)}%)`
      wd.style.filter = p < 0.99 ? `blur(${((1 - p) * 8).toFixed(2)}px)` : 'none'
    })
    if (s) show(s, smooth(0.35, 0.9, lt), 8, 16)
  }
}

// ---------- real games (see ../game-clips/CREDITS.md) ----------
// seek(t) collects decode promises from the clip players and returns them, so the renderer waits for frames
const PENDING = []
const need = (p) => { if (p) PENDING.push(p) }
const RG = window.REAL_GAMES, GP = window.GAME_PLAYER
// real gameplay clip if we recorded one, otherwise the creator's screenshot with a slow push-in
function realMedia(parent, key, w, h, { still = 0, offset = 0, style = {} } = {}) {
  const img = el('img', '', Object.assign({ position: 'absolute', left: 0, top: 0, width: w + 'px', height: h + 'px', objectFit: 'cover', display: 'block' }, style), parent)
  const g = RG[key]
  if (g.clip && still === 0) { const play = GP.clip(img, g.clip, offset); return (t) => need(play(t)) }
  img.src = GP.still(g.stills[Math.max(0, still - (g.clip ? 1 : 0)) % g.stills.length])
  return (t) => { img.style.transform = `scale(${(1.06 + 0.04 * Math.sin((t + offset) * 0.35)).toFixed(4)}) translateX(${(Math.sin((t + offset) * 0.2) * 1.5).toFixed(2)}%)` }
}

// ---------- mini games: procedural "gameplay" drawn as a function of time ----------
const GAMES = {
  runner(g, w, h, t) {
    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#2a1266'); sky.addColorStop(1, '#ff4fd8')
    g.fillStyle = sky; g.fillRect(0, 0, w, h)
    g.fillStyle = '#ffd36b'; g.beginPath(); g.arc(w * 0.72, h * 0.42, w * 0.16, 0, 7); g.fill()
    for (let layer = 0; layer < 2; layer++) {
      g.fillStyle = layer ? '#1b0f3d' : '#3b1c7a'
      g.beginPath(); g.moveTo(0, h)
      const sp = layer ? 90 : 40, off = (t * sp) % (w * 0.5)
      for (let x = -w * 0.5; x <= w * 1.5; x += w * 0.25) g.lineTo(x - off, h * (layer ? 0.66 : 0.58) - (Math.sin(x * 0.02 + layer) * 0.5 + 0.5) * h * 0.14)
      g.lineTo(w * 2, h); g.fill()
    }
    const gy = h * 0.78
    g.fillStyle = '#0d0822'; g.fillRect(0, gy, w, h - gy)
    g.strokeStyle = '#c6ff3d'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, gy); g.lineTo(w, gy); g.stroke()
    const period = 1.1, ph = (t % period) / period
    for (let i = 0; i < 3; i++) { const ox = ((1 - ((t * 0.9 + i / 3) % 1)) * w * 1.3) - w * 0.15; g.fillStyle = '#ff4fd8'; g.fillRect(ox, gy - h * 0.07, w * 0.05, h * 0.07) }
    const jump = Math.sin(Math.PI * clamp(ph * 1.6)) * h * 0.2
    const s = w * 0.085
    g.save(); g.translate(w * 0.25, gy - s / 2 - jump); g.rotate(ph * Math.PI * (ph < 0.62 ? 1 : 0))
    g.fillStyle = '#c6ff3d'; g.shadowColor = '#c6ff3d'; g.shadowBlur = 20; g.fillRect(-s / 2, -s / 2, s, s); g.restore()
  },
  shooter(g, w, h, t) {
    g.fillStyle = '#05040c'; g.fillRect(0, 0, w, h)
    const r = rng(7)
    for (let i = 0; i < 70; i++) { const x = r() * w, sp = 60 + r() * 220, y = (r() * h + t * sp) % h; g.fillStyle = `rgba(255,255,255,${0.3 + r() * 0.6})`; g.fillRect(x, y, 2, 2 + sp / 60) }
    for (let row = 0; row < 3; row++) for (let c = 0; c < 5; c++) {
      const x = w * 0.18 + c * w * 0.16 + Math.sin(t * 1.6) * w * 0.08, y = h * 0.14 + row * h * 0.08
      const alive = ((c * 7 + row * 3 + Math.floor(t * 2)) % 9) !== 0
      if (!alive) continue
      g.fillStyle = ['#ff4fd8', '#7c5cff', '#3de0ff'][row]; g.fillRect(x - w * 0.035, y - w * 0.02, w * 0.07, w * 0.04)
    }
    const sx = w / 2 + Math.sin(t * 2.3) * w * 0.3, sy = h * 0.84
    for (let i = 0; i < 6; i++) { const by = sy - ((t * 900 + i * 110) % (h * 0.8)); g.fillStyle = '#c6ff3d'; g.fillRect(sx - 2, by, 4, 16) }
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(sx, sy - w * 0.06); g.lineTo(sx - w * 0.05, sy + w * 0.03); g.lineTo(sx + w * 0.05, sy + w * 0.03); g.fill()
    g.fillStyle = '#ff9d3d'; g.beginPath(); g.moveTo(sx - w * 0.02, sy + w * 0.03); g.lineTo(sx, sy + w * (0.06 + 0.02 * Math.sin(t * 40))); g.lineTo(sx + w * 0.02, sy + w * 0.03); g.fill()
  },
  blocks(g, w, h, t) {
    g.fillStyle = '#0b0a1a'; g.fillRect(0, 0, w, h)
    const cols = 8, cs = w / cols, rows = Math.ceil(h / cs)
    const cl = ['#7c5cff', '#ff4fd8', '#c6ff3d', '#3de0ff', '#ffb36b']
    const r = rng(3)
    for (let y = rows - 4; y < rows; y++) for (let x = 0; x < cols; x++) if (r() > 0.25) { g.fillStyle = cl[Math.floor(r() * 5)]; g.fillRect(x * cs + 2, y * cs + 2, cs - 4, cs - 4) }
    const fall = (t * 3.2) % (rows - 4)
    const shape = [[0, 0], [1, 0], [2, 0], [1, 1]]
    const fx = 2 + Math.floor((t * 0.7) % 4)
    g.fillStyle = cl[Math.floor(t / 1.25) % 5]; g.shadowColor = g.fillStyle; g.shadowBlur = 16
    for (const [dx, dy] of shape) g.fillRect((fx + dx) * cs + 2, (Math.floor(fall) + dy) * cs + 2, cs - 4, cs - 4)
    g.shadowBlur = 0
    g.strokeStyle = 'rgba(255,255,255,0.05)'
    for (let x = 0; x <= cols; x++) { g.beginPath(); g.moveTo(x * cs, 0); g.lineTo(x * cs, h); g.stroke() }
  },
  racer(g, w, h, t) {
    const sky = g.createLinearGradient(0, 0, 0, h * 0.5); sky.addColorStop(0, '#120a33'); sky.addColorStop(1, '#ff6b9d')
    g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.5)
    g.fillStyle = '#ffd36b'; g.beginPath(); g.arc(w / 2, h * 0.5, w * 0.2, Math.PI, 0); g.fill()
    g.fillStyle = '#12082b'; g.fillRect(0, h * 0.5, w, h * 0.5)
    const hy = h * 0.5, curve = Math.sin(t * 0.8) * w * 0.15
    for (let i = 0; i < 26; i++) {
      const z = ((i / 26 + t * 1.3) % 1), zz = z * z
      const y = hy + zz * h * 0.5, half = w * (0.04 + zz * 0.55), cx = w / 2 + curve * (1 - z)
      g.strokeStyle = i % 2 ? '#7c5cff' : '#3de0ff'; g.lineWidth = 1 + zz * 3
      g.beginPath(); g.moveTo(cx - half, y); g.lineTo(cx + half, y); g.stroke()
    }
    g.strokeStyle = '#ff4fd8'; g.lineWidth = 3
    g.beginPath(); g.moveTo(w / 2 + curve, hy); g.lineTo(w * 0.02, h); g.moveTo(w / 2 + curve, hy); g.lineTo(w * 0.98, h); g.stroke()
    const cx = w / 2 + Math.sin(t * 1.9) * w * 0.18
    g.fillStyle = '#c6ff3d'; g.shadowColor = '#c6ff3d'; g.shadowBlur = 24
    g.fillRect(cx - w * 0.08, h * 0.82, w * 0.16, h * 0.07); g.shadowBlur = 0
    g.fillStyle = '#ff3355'; g.fillRect(cx - w * 0.07, h * 0.87, w * 0.035, h * 0.015); g.fillRect(cx + w * 0.035, h * 0.87, w * 0.035, h * 0.015)
  },
  farm(g, w, h, t) {
    g.fillStyle = '#2d6a3e'; g.fillRect(0, 0, w, h)
    const cs = w / 6
    for (let y = 0; y < Math.ceil(h / cs); y++) for (let x = 0; x < 6; x++) {
      g.fillStyle = (x + y) % 2 ? '#3a8a4f' : '#347c47'; g.fillRect(x * cs, y * cs, cs, cs)
      if (y > 1 && y < 6 && x > 0 && x < 5) {
        g.fillStyle = '#6b4a2b'; g.fillRect(x * cs + 6, y * cs + 6, cs - 12, cs - 12)
        const grow = clamp(((t * 0.6 + x * 0.17 + y * 0.29) % 1.4))
        g.fillStyle = grow > 0.8 ? '#ffb36b' : '#8dff6b'
        g.beginPath(); g.arc(x * cs + cs / 2, y * cs + cs / 2, Math.max(0, (cs / 2 - Math.min(10, cs * 0.2)) * grow), 0, 7); g.fill()
      }
    }
    const px_ = w * 0.5 + Math.sin(t * 1.1) * w * 0.3, py = h * 0.8 + Math.cos(t * 0.9) * h * 0.05
    g.fillStyle = '#fff4e0'; g.fillRect(px_ - cs * 0.25, py - cs * 0.5, cs * 0.5, cs * 0.6)
    g.fillStyle = '#ff4fd8'; g.fillRect(px_ - cs * 0.28, py - cs * 0.62, cs * 0.56, cs * 0.16)
  },
  dungeon(g, w, h, t) {
    g.fillStyle = '#07050d'; g.fillRect(0, 0, w, h)
    const cs = w / 7
    for (let y = 0; y < Math.ceil(h / cs); y++) for (let x = 0; x < 7; x++) { g.fillStyle = (x * 3 + y * 5) % 7 === 0 ? '#1d1830' : '#15111f'; g.fillRect(x * cs + 1, y * cs + 1, cs - 2, cs - 2) }
    const hx = w * 0.5 + Math.sin(t * 0.9) * w * 0.25, hy = h * 0.55 + Math.sin(t * 1.3) * h * 0.2
    for (let i = 0; i < 3; i++) { const ex = w * (0.2 + i * 0.3), ey = h * (0.25 + 0.2 * Math.sin(t + i)); g.fillStyle = '#ff3355'; g.beginPath(); g.arc(ex, ey, cs * 0.25, 0, 7); g.fill() }
    g.fillStyle = '#3de0ff'; g.fillRect(hx - cs * 0.22, hy - cs * 0.22, cs * 0.44, cs * 0.44)
    const light = g.createRadialGradient(hx, hy, cs * 0.3, hx, hy, w * 0.55)
    light.addColorStop(0, 'rgba(0,0,0,0)'); light.addColorStop(1, 'rgba(0,0,0,0.92)')
    g.fillStyle = light; g.fillRect(0, 0, w, h)
    g.fillStyle = 'rgba(255,180,90,0.12)'; g.beginPath(); g.arc(hx, hy, cs * (1.2 + 0.1 * Math.sin(t * 13)), 0, 7); g.fill()
  },
}
function gameCanvas(parent, kind, w, h, style = {}) {
  const c = el('canvas', '', Object.assign({ width: w + 'px', height: h + 'px' }, style), parent)
  c.width = w; c.height = h
  const g = c.getContext('2d')
  return (t) => GAMES[kind](g, w, h, t)
}
const ICON = {

// ---------- background ----------
const bg = $('bg').getContext('2d')
function drawBackground(t) {
  bg.fillStyle = '#07060d'; bg.fillRect(0, 0, W, H)
  const blobs = [[0.2, 0.3, '124,92,255', 0.35], [0.8, 0.7, '255,79,216', 0.25], [0.6, 0.15, '61,224,255', 0.14]]
  blobs.forEach(([x, y, c, a], i) => {
    const cx = W * (x + 0.06 * Math.sin(t * 0.3 + i * 2)), cy = H * (y + 0.06 * Math.cos(t * 0.25 + i))
    const gr = bg.createRadialGradient(cx, cy, 0, cx, cy, W * 0.45)
    gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`)
    bg.fillStyle = gr; bg.fillRect(0, 0, W, H)
  })
  // perspective floor grid
  bg.strokeStyle = 'rgba(160,140,255,0.08)'; bg.lineWidth = 1
  const hy = H * 0.62
  for (let i = -14; i <= 14; i++) { bg.beginPath(); bg.moveTo(W / 2 + i * 30, hy); bg.lineTo(W / 2 + i * 260, H); bg.stroke() }
  for (let k = 0; k < 12; k++) { const z = ((k / 12 + t * 0.08) % 1), y = hy + z * z * (H - hy); bg.beginPath(); bg.moveTo(0, y); bg.lineTo(W, y); bg.stroke() }
}

// ---------- seek ----------
function seek(tIn) {
  const t = clamp(tIn, 0, DUR - 1e-6)
  drawBackground(t)
  let flash = 0
  for (const s of scenes) {
    const lt = t - s.t0
    let v
    if (s.enter === 'cut') v = t >= s.t0 && t < s.t1 ? 1 : 0
    else v = smooth(s.t0 - 0.05, s.t0 + 0.3, t) * (s.name === 'end' ? 1 : 1 - smooth(s.t1 - 0.22, s.t1, t))
    if (s.name === 'hook') v = (t < s.t1 ? 1 : 0) * (1 - smooth(s.t1 - 0.15, s.t1, t))
    // display, not visibility: children that set visibility:visible would otherwise leak through a hidden parent
    if (v < 0.002) { s.div.style.display = 'none'; continue }
    s.div.style.display = 'block'
    s.div.style.opacity = v.toFixed(4)
    const enterP = clamp((t - s.t0 + 0.05) / 0.35), exitP = s.name === 'end' ? 0 : smooth(s.t1 - 0.22, s.t1, t)
    let tf = '', blur = 0
    if (s.enter === 'zoom' || s.enter === 'flash') { tf = `scale(${(lerp(1.08, 1, easeOut(enterP)) * lerp(1, 0.94, exitP)).toFixed(4)})`; blur = (1 - easeOut(enterP)) * 14 + exitP * 12 }
    else if (s.enter === 'slide') { tf = `translateX(${((1 - easeOutExpo(enterP)) * 240 - exitP * 180).toFixed(1)}px)`; blur = (1 - easeOut(enterP)) * 10 + exitP * 10 }
    s.div.style.transform = tf
    s.div.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none'
    if (s.enter === 'flash') flash = Math.max(flash, Math.exp(-Math.max(0, t - s.t0) * 5) * (t >= s.t0 ? 1 : 0))
    s.update(lt)
  }
  $('flash').style.opacity = (flash * 0.85).toFixed(4)
  $('turb').setAttribute('seed', Math.floor(t * 24) % 60)
  const ps = PENDING.splice(0)
  return ps.length ? Promise.all(ps) : undefined
}

// ---------- api ----------
window.seek = seek
window.timeline = () => ({ duration: DUR, bpm: BPM, beat: B, cues: CUES.slice().sort((a, c) => a.t - c.t) })
window.configure = () => {}

if (!window.__RENDER__) {
  document.body.classList.add('preview')
  const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth / W, innerHeight / H))
  fit(); addEventListener('resize', fit)
  const params = new URLSearchParams(location.search)
  document.fonts.ready.then(() => {
    if (params.has('t')) seek(+params.get('t'))
    else { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop) }; loop() }
  })
}
</script>
