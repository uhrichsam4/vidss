<!doctype html>
<!--
  swapstudio: the song. A 1920x1080 lyric video for the app, in the style of the reference (kinetic words on every
  syllable, dark HUD frames with corner marks, one orange accent, wireframe 3D, cuts on the beat).
  The song (audio/song.wav, audio/song.json) sets every time: each word appears on the note it is sung on.
  Every frame is a pure function of time in async seek(t); the maker's real hand (data/hand_motion.json) drives the
  hand scenes and the model follows the app's rules, simulated once on load.
-->
<html>
<head>
<meta charset="utf-8" />
<title>swapstudio: the song</title>
<style>html, body { margin: 0; background: #09090a; } canvas { display: block; }
  body.preview { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.preview canvas { transform: scale(var(--fit, 0.5)); transform-origin: center; }</style>
<script type="importmap">{ "imports": {
  "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/",
  "troika-three-text": "./node_modules/troika-three-text/dist/troika-three-text.esm.js",
  "troika-three-utils": "./node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
  "troika-worker-utils": "./node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
  "webgl-sdf-generator": "./node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
  "bidi-js": "./node_modules/bidi-js/dist/bidi.mjs" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'
import { Text } from 'troika-three-text'
import { loadHand, PALM_J } from './hand.js'

const W = 1920, H = 1080
window.SIZE = [W, H]
const COL = { bg: '#09090a', line: '#2a2a2e', grid: '#161618', dim: '#8a857e', text: '#f2eee6', accent: '#ff5a1f', paper: '#ece6da', ink: '#141414' }
const FONT = { wide: 'assets/fonts/archivo-125-800.ttf', ui: 'assets/fonts/Geist-Regular.ttf', uiM: 'assets/fonts/Geist-Medium.ttf', uiS: 'assets/fonts/Geist-SemiBold.ttf',
  mono: 'assets/fonts/GeistMono-Regular.ttf', monoM: 'assets/fonts/GeistMono-Medium.ttf', serif: 'assets/fonts/InstrumentSerif-Italic.woff' }

// ---------- time ----------
let SONG, BEAT, BAR, DUR
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x))
const lerp = (a, c, p) => a + (c - a) * p
const ease = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }
const eout = (u) => 1 - Math.pow(1 - clamp(u), 3)
function S(t, f, z) { if (t <= 0) return 0; const w = 2 * Math.PI * f; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t)) }
const pop = (t, t0, f = 3.4) => S(t - t0, f, 0.5)
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z)
const tiny = (s) => Math.max(1e-4, s)

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, H)
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping
renderer.autoClear = false; renderer.localClippingEnabled = true
renderer.setClearColor(new THREE.Color(COL.bg), 1)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()                                  // one scene; each shot shows its own objects
const hud = new THREE.Scene()                                    // frame marks and labels, drawn last in pixels
const lyr = new THREE.Scene()                                    // the sung words: screen space, over every shot
const ortho = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -8000, 8000)
const persp = new THREE.PerspectiveCamera(35, W / H, 1, 50000)
const key = new THREE.DirectionalLight('#fff3e6', 2.2); key.position.set(600, 1400, 1200); scene.add(key, key.target)
const rim = new THREE.DirectionalLight(COL.accent, 1.2); rim.position.set(-900, 300, -800); scene.add(rim)

const managed = [], texts = []
const hideAll = () => managed.forEach((m) => (m.visible = false))
function add(o, parent = scene) { parent.add(o); managed.push(o); return o }
function txt(str, { font = FONT.ui, size = 40, color = COL.text, ax = 'left', ay = 'middle', maxW = Infinity, lh = 1.1, ls = 0, order = 10, parent = scene, stroke = 0 } = {}) {
  const t = new Text(); t.material = new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true })
  Object.assign(t, { text: str, font, fontSize: size, color, anchorX: ax, anchorY: ay, maxWidth: maxW, lineHeight: lh, letterSpacing: ls })
  if (stroke) { t.fillOpacity = 0; t.strokeWidth = stroke; t.strokeColor = color }
  t.renderOrder = order; texts.push(t); return add(t, parent)
}
const syncOne = (t) => new Promise((r) => { if (t._needsSync && !t._isSyncing) return t.sync(r); const d = () => { t.removeEventListener('synccomplete', d); r() }; t.addEventListener('synccomplete', d); if (t._needsSync) t.sync() })
const syncAll = async () => { for (let k = 0; k < 4; k++) { const ts = texts.filter((t) => t.visible && (t._needsSync || t._isSyncing)); if (!ts.length) return; await Promise.all(ts.map(syncOne)) } }
const lineMat = (c = COL.line, o = 1) => new THREE.LineBasicMaterial({ color: c, transparent: o < 1, opacity: o, toneMapped: false })
function rect(w, h, color, order = 1, parent = scene) { const m = add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color, toneMapped: false, transparent: true })), parent); m.scale.set(w, h, 1); m.renderOrder = order; return m }
function frameLines(w, h, color = COL.text, parent = scene) {  // a rectangle outline (unit, scaled)
  const g = new THREE.BufferGeometry().setFromPoints([V(-0.5, -0.5), V(0.5, -0.5), V(0.5, 0.5), V(-0.5, 0.5), V(-0.5, -0.5)])
  const l = add(new THREE.Line(g, lineMat(color)), parent); l.scale.set(w, h, 1); l.renderOrder = 6; return l
}
function brackets(color = COL.text, parent = scene, arm = 0.14) {   // four corner brackets of a unit box
  const P = []; for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { P.push(V(sx * 0.5, sy * 0.5), V(sx * (0.5 - arm), sy * 0.5), V(sx * 0.5, sy * 0.5), V(sx * 0.5, sy * (0.5 - arm))) }
  const l = add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P), lineMat(color)), parent); l.renderOrder = 7; return l
}
function place(o, x, y, z = 0, s = 1) { o.visible = true; o.position.set(x, y, z); if (typeof s === 'number') o.scale.setScalar(tiny(s)); return o }

// ---------- data ----------
let facts, hand, TCH, sim = {}
const E = {}
const imgCache = new Map()
function frameImg(dir, i) {                                        // webcam frames (the maker's own clip), cached
  const k = dir + i; if (!imgCache.has(k)) { const im = new Image(); im.src = `webcam/${dir}/${String(i).padStart(3, '0')}.jpg`; imgCache.set(k, im.decode().then(() => im)); if (imgCache.size > 24) imgCache.delete(imgCache.keys().next().value) }
  return imgCache.get(k)
}
let camTrack
async function setCam(tex, i) { i = clamp(Math.round(i), 0, 317); if (tex.userData.i === i) return; tex.image = await frameImg('before', i); tex.userData.i = i; tex.needsUpdate = true }

// ================= lyrics: display words, syllables, emphasis =================
// [display word, syllables it spans, emphasis?] per sung line, in the song's order
const WORDS = [
  [['One', 1], ['photo,', 2, 1], ["that's", 1], ['all', 1], ['it', 1], ['takes.', 1]],
  [['swap', 1], ['your', 1], ['face,', 1], ['live,', 1, 1], ['on', 1], ['the', 1], ['camera.', 3]],
  [['thirty', 2, 1], ['frames', 1], ['a', 1], ['second,', 2], ['smooth', 1], ['and', 1], ['clean.', 1]],
  [['running', 2], ['on', 1], ['your', 1], ['Mac,', 1, 1], ['not', 1], ['a', 1], ['cloud', 1], ['machine.', 2]],
  [['Double', 2], ['click,', 1], ['pick', 1], ['a', 1], ['face,', 1], ['and', 1], ['START', 1, 1]],
  [['Open', 2], ['your', 1], ['hand,', 1], ['a', 1], ['model', 2], ['appears.', 2, 1]],
  [['pinch', 1, 1], ['it', 1], ['and', 1], ['it', 1], ['stays,', 1], ['it', 1], ['only', 2], ['turns.', 1, 1]],
  [['two', 1], ['quick', 1], ['pinches,', 2], ['it', 1], ['looks', 1], ['back', 1], ['at', 1], ['YOU.', 1, 1]],
  [['three', 1], ['fingers', 2], ['up,', 1], ['it', 1], ['GROWS,', 1, 1], ['down,', 1], ['it', 1], ['shrinks.', 1, 1]],
  [['Reach', 1], ['for', 1], ['the', 1], ['shelf,', 1, 1], ['ten', 1], ['models', 2], ['wait.', 1]],
  [['pinch', 1], ['it,', 1], ['pull', 1], ['it,', 1], ['it', 1], ['fights', 1, 1], ['back,', 1], ['then', 1], ['POPS', 1, 1], ['in', 1], ['your', 1], ['hand.', 1]],
  [['Hands', 1, 1], ['in', 1], ['front', 1], ['of', 1], ['your', 1], ['face,', 1]],
  [['the', 1], ['face', 1], ['stays', 1], ['clean,', 1], ['it', 1], ['never', 2, 1], ['glitches.', 2]],
  [['send', 1], ['it', 1], ['to', 1], ['your', 1], ['calls', 1, 1], ['and', 1], ['OBS.', 3, 1]],
  [['an', 1], ['AI', 2, 1], ['effect', 2], ['tag', 1], ['in', 1], ['the', 1], ['corner.', 2]],
  [['swap', 1], ['studio.', 3]],
]
// word times: the first syllable's note
function lyricTimes() {
  return SONG.lines.map((L, li) => { let s = 0; return WORDS[li].map(([w, n, em]) => { const t = L.syl_t[s]; s += n; return { w, t, em: !!em } }) })
}
let LT                                                               // [line][word] -> {w, t, em}
// a lyric block: words set left to right, wrapping at maxW, each rising in on its own syllable
function makeBlock(li, { size = 96, emSize = 1.15, font = FONT.wide, emFont = FONT.serif, upper = true, maxW = 1500, lh = 1.02, color = COL.text, emColor = COL.accent, order = 20 } = {}) {
  const ws = LT[li].map((o) => {
    const s = upper && !o.em ? o.w.toUpperCase() : o.w
    const t = txt(s, { font: o.em ? emFont : font, size: o.em ? size * emSize : size, color: o.em ? emColor : color, ax: 'left', ay: 'bottom-baseline', order, parent: lyr })
    t.visible = true; return { w: o.w, at: o.t, em: o.em, t }
  })
  return { li, ws, size, maxW, lh }
}
async function layoutBlocks(blocks) {
  await syncAll()
  for (const b of blocks) {
    let x = 0, row = 0; const sp = b.size * 0.3
    b.ws.forEach((w) => { const bb = w.t.textRenderInfo.blockBounds, wd = bb[2] - bb[0]; if (x > 0 && x + wd > b.maxW) { x = 0; row++ } w.x = x; w.row = row; w.wd = wd; x += wd + sp })
    b.rows = row + 1; b.rowW = []; b.ws.forEach((w) => (b.rowW[w.row] = Math.max(b.rowW[w.row] || 0, w.x + w.wd)))
    b.ws.forEach((w) => (w.t.visible = false))
  }
}
// draw a block at (x, y) = top-left of its first row; align 'left' | 'center'; words rise through a mask line
function drawBlock(b, t, x, y, { align = 'left', z = 0, rise = 0.14, out = 1e9, parent = null } = {}) {
  for (const w of b.ws) {
    const k = eout((t - w.at + 0.03) / rise); if (k <= 0) continue
    const lead = align === 'center' ? -b.rowW[w.row] / 2 : 0
    const baseY = y - (w.row + 1) * b.size * b.lh, leave = eout((t - out) / 0.2)
    const yy = baseY - (1 - k) * b.size * 0.6 + leave * b.size * 1.1
    w.t.visible = true; w.t.position.set(x + lead + w.x, yy, z)
    const pl = w.t.material.clippingPlanes || (w.t.material.clippingPlanes = [new THREE.Plane(), new THREE.Plane()])
    pl[0].set(V(0, 1, 0), -(baseY - b.size * 0.3)); pl[1].set(V(0, -1, 0), baseY + b.size * 1.05)
  }
}

// ================= build =================
async function build() {
  ;[SONG, facts, TCH] = await Promise.all(['audio/song.json', 'data/facts.json', 'data/touches.json'].map((u) => fetch(u).then((r) => r.json())))
  BAR = SONG.bar; BEAT = BAR / 4; DUR = SONG.duration
  camTrack = await fetch('webcam/track.json').then((r) => r.json())
  hand = await loadHand('data/hand_motion.json')
  LT = lyricTimes()
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromEquirectangular(await new RGBELoader().loadAsync('assets/hdri/monochrome_studio_02_1k.hdr')).texture
  scene.environmentIntensity = 0.45
  buildHud(); buildRings(); buildWell(); await loadModels(); buildHand(); buildProps()
  E.word.visible = true; await syncAll(); E.wordW = E.word.textRenderInfo.blockBounds[2]; E.word.visible = false
  E.blocks = WORDS.map((_, li) => makeBlock(li, BLOCK_STYLE[li] || {}))
  await layoutBlocks(E.blocks)
  simulate()
}

// ---------- the frame: corner marks, hairline grid, labels (the reference's HUD) ----------
function buildHud() {
  const P = [], m = 40, a = 30
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const x = sx * (W / 2 - m), y = sy * (H / 2 - m); P.push(V(x, y), V(x - sx * a, y), V(x, y), V(x, y - sy * a)) }
  E.marks = add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P), lineMat('#6b6760')), hud)
  E.hudL = txt('SWAPSTUDIO', { font: FONT.monoM, size: 18, color: '#8a857e', ax: 'left', ay: 'top', ls: 0.12, parent: hud })
  E.hudR = txt('', { font: FONT.mono, size: 18, color: '#8a857e', ax: 'right', ay: 'top', ls: 0.12, parent: hud })
  E.hudB = txt('', { font: FONT.mono, size: 16, color: '#5f5b55', ax: 'left', ay: 'bottom', ls: 0.1, parent: hud })
  // hairline grid (behind everything in flat shots)
  const G = []; for (let x = -W; x <= W; x += 120) G.push(V(x, -H), V(x, H)); for (let y = -H; y <= H; y += 120) G.push(V(-W, y), V(W, y))
  E.grid = add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(G), lineMat(COL.grid))); E.grid.renderOrder = 0
}
const SECTION = (t) => { const bar = t / BAR; return bar < 2 ? 'INTRO' : bar < 10 ? 'VERSE' : bar < 12 ? 'BUILD' : bar < 20 ? 'CHORUS' : bar < 24 ? 'BREAK' : bar < 32 ? 'CHORUS' : 'OUTRO' }
function hudDraw(t, li) {
  E.marks.visible = true
  place(E.hudL, -W / 2 + 64, H / 2 - 56, 0, 1)
  E.hudR.text = `${SECTION(t)}  /  ${li < 0 ? 'OPEN' : String(li + 1).padStart(2, '0') + ' OF 16'}`; place(E.hudR, W / 2 - 64, H / 2 - 56, 0, 1)
  E.hudB.text = 'LIVE FACE SWAP  -  3D IN YOUR HAND  -  RUNS ON YOUR MAC'; place(E.hudB, -W / 2 + 64, -H / 2 + 50, 0, 1)
}

// ---------- topographic rings (the reference's contour lines) ----------
function buildRings() {
  E.rings = new THREE.Group(); add(E.rings)
  for (let k = 0; k < 42; k++) {
    const r0 = 40 + k * 26, pts = []
    for (let i = 0; i <= 256; i++) {
      const a = (i / 256) * Math.PI * 2, n = Math.sin(a * 3 + k * 0.7) * 0.05 + Math.sin(a * 5 - k * 0.31) * 0.035 + Math.sin(a * 9 + k) * 0.015
      pts.push(V(Math.cos(a) * r0 * (1 + n * (0.4 + k / 42)), Math.sin(a) * r0 * (1 + n * (0.4 + k / 42)), 0))
    }
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(k % 5 === 0 ? '#4a4640' : '#2c2a28')); E.rings.add(l)
  }
  E.core = add(new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshBasicMaterial({ color: COL.accent, toneMapped: false })))
  E.glow = add(new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, toneMapped: false,
    uniforms: { c: { value: new THREE.Color(COL.accent) }, o: { value: 1 } },
    vertexShader: 'varying vec2 v; void main(){ v = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 c; uniform float o; varying vec2 v; void main(){ float d = length(v); gl_FragColor = vec4(c, o * pow(max(0.0, 1.0 - d), 2.2) * 0.55); }' })))
}
// ---------- the gravity-well grid (the reference's warped wireframe floor) ----------
function buildWell() {
  const P = [], R = 3200, st = 110, depth = (x, z) => -520 * Math.exp(-(x * x + z * z) / (2 * 520 * 520))
  for (let x = -R; x <= R; x += st) for (let z = -R; z < R; z += st / 4) P.push(V(x, depth(x, z), z), V(x, depth(x, z + st / 4), z + st / 4))
  for (let z = -R; z <= R; z += st) for (let x = -R; x < R; x += st / 4) P.push(V(x, depth(x, z), z), V(x + st / 4, depth(x + st / 4, z), z))
  E.well = add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P), lineMat('#3a3632')))
}
// ---------- models ----------
const MODELS = {}
async function loadModels() {
  const gl = new GLTFLoader()
  for (let k = 1; k <= 6; k++) {
    const o = (await gl.loadAsync(`assets/models/m${k}.glb`)).scene, box = new THREE.Box3().setFromObject(o), c = box.getCenter(V()), r = box.getBoundingSphere(new THREE.Sphere()).radius
    o.position.sub(c); const wrap = new THREE.Group(); wrap.add(o); wrap.scale.setScalar(0.5 / r); MODELS['m' + k] = wrap
  }
}
function modelInstance(name) {
  const root = new THREE.Group(); root.add(SkeletonUtils.clone(MODELS[name])); root.traverse((m) => { if (m.isMesh) { m.frustumCulled = false; m.material = m.material.clone() } })
  root.place = (p, d, q) => { root.visible = d > 0.5; root.position.copy(p); root.scale.setScalar(Math.max(1e-3, d)); if (q) root.quaternion.copy(q) }
  return add(root)
}
// ---------- the 3D hand (the maker's real joints) ----------
function buildHand() {
  const m = new THREE.MeshStandardMaterial({ color: COL.text, roughness: 0.4, metalness: 0.1 })
  E.hj = []; E.hb = []
  for (let j = 0; j < 21; j++) E.hj.push(add(new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), m)))
  hand.BONES.forEach(() => E.hb.push(add(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10), m))))
  E.ring3 = add(new THREE.Mesh(new THREE.TorusGeometry(1, 0.07, 10, 64), new THREE.MeshBasicMaterial({ color: COL.accent, toneMapped: false })))
}
function drawHand(P, r = 7, br = 3.4) {
  P.forEach((p, j) => { E.hj[j].visible = true; E.hj[j].position.copy(p); E.hj[j].scale.setScalar(r) })
  hand.BONES.forEach(([a, c], k) => { const d = P[c].clone().sub(P[a]), L = d.length(); const cy = E.hb[k]; cy.visible = true; cy.position.copy(P[a]).addScaledVector(d, 0.5); cy.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); cy.scale.set(br, L, br) })
}
// joints in millimetres around the palm centre, at clip time c
const handAt = (c) => hand.metresAt(c).map((v) => v.multiplyScalar(1000))

// ---------- the model obeys the app (effect.py, rotation.py, pose.py), simulated once at 30 Hz ----------
function simulate() {
  const N = hand.N, R = [], pinch = TCH.touches[0], zoom = TCH.zoom, taps = TCH.touches.filter((t) => t.dur_s && t.dur_s < 0.5).slice(0, 2)
  let yaw = 0, pitch = 0, v = 0, pinched0 = false, last = null, size = 1, face = null
  const pp = (i) => { const p = hand.pic[hand.nearest(i)]; return [(p[4][0] + p[8][0]) / 2, (p[4][1] + p[8][1]) / 2] }
  for (let i = 0; i < N; i++) {
    const pinched = i >= pinch.start_f && i < pinch.end_f
    if (pinched) { if (!pinched0) last = pp(i); const p = pp(i), dx = p[0] - last[0], dy = p[1] - last[1]; last = p; const dY = (2 * Math.PI * dx) / 640; yaw += dY; v = 0.6 * v + 0.4 * dY * 30; pitch = clamp(pitch + (2 * Math.PI * dy) / 640, -Math.PI / 3, Math.PI / 3) }
    else { v *= Math.pow(0.5, 1 / 30 / 0.6); yaw += v / 30; if (Math.abs(v) < 0.08) { const w = 1 - Math.pow(0.5, 1 / 30 / 0.12), wr = Math.atan2(Math.sin(yaw), Math.cos(yaw)); if (Math.abs(wr) < 0.35) yaw -= wr * w; pitch *= 1 - w } }
    pinched0 = pinched
    if (taps.length === 2 && i === taps[1].start_f) face = { i, from: new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ')) }
    let q = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'))
    if (face) { const k = clamp((i - face.i) / 7.5); q = face.from.clone().slerp(new THREE.Quaternion(), ease(k)); if (k >= 1) { yaw = 0; pitch = 0 } }
    if (i >= zoom.middle_joined_f && i < zoom.let_go_f) { const p0 = pp(zoom.fingertips_met_f), p = pp(i); size = clamp(Math.pow(2, -((p[1] - p0[1]) / 720) / 0.25), 0.3, 4) }
    R.push({ q, size, pinched })
  }
  sim.R = R
}
const simAt = (c) => sim.R[clamp(Math.floor(c * 30), 0, sim.R.length - 1)]

// ---------- props used by several shots ----------
function buildProps() {
  // photo card + camera frame textures
  E.camTex = new THREE.Texture(); E.camTex.colorSpace = THREE.SRGBColorSpace; E.camTex.userData.i = -1
  E.camTex2 = new THREE.Texture(); E.camTex2.colorSpace = THREE.SRGBColorSpace; E.camTex2.userData.i = -1
  E.photo = add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: E.camTex, toneMapped: false }))); E.photo.renderOrder = 3

// 11: pinch it, pull it, it fights back, then POPS in your hand: the shelf pull, popping on "pops"
function shot11(t, li) {
  const pw = LT[li].find((w) => w.w === 'POPS').t, c = 8.367 + (t - pw) + 0.12, { P, cam, palm } = handScene(t, c, { orbit: -0.15, dist: 620 })

  const i = Math.floor(c * 30), pch = TCH.touches[0], gr = i >= pch.start_f && !popped
  const tip = P[4].clone().add(P[8]).multiplyScalar(0.5), tile = V(col.x, col.y + 240 - 2 * (tl + 16), col.z + 2)
  if (gr) { const x = clamp(tip.distanceTo(tile) / 520), pic = tile.clone().lerp(tip, 1.3 * (1 - Math.pow(1 - x, 1.5)) * 0.5); E.shelfM[2].place(pic, tl * 0.85 * (1 + 0.3 * x), cam.quaternion.clone())

  if (popped) { const s = S(t - pw, 1.6, 0.45); E.popM.place(palm.clone().add(V(0, 130, 60)), lerp(tl * 0.85, 180, s), new THREE.Quaternion().slerp(cam.quaternion, 0)) }

// 12: Hands in front of your face: the maker's hand passing in front of their face, the face box holds

const SHOTS = [shot1, shot2, shot3, shot4, shot5, shot6, shot7, shot8, shot9, shot10, shot11, shot12, shot13, shot14, shot15, shotEnd]

// ================= seek =================
async function seek(tIn) {
  const t = clamp(tIn, 0, DUR - 1e-6)
  hideAll()
  E.rings.position.set(0, 0, -10)
  let li = SONG.lines.findIndex((L, k) => t >= L.t && t < lineEnd(k))
  const cam = li < 0 ? shotIntro(t) : await SHOTS[li](t, li)
  hudDraw(t, li)
  await syncAll()
  renderer.clear(); renderer.render(scene, cam); renderer.clearDepth(); renderer.render(lyr, hudCam); renderer.clearDepth(); renderer.render(hud, hudCam)
}
