<!doctype html>
<!--
  swapstudio: launch film. 1440x1440, 120 BPM, 120 beats (1 minute), one camera that never cuts.
  Flat (keynote 2D, near-orthographic at 0.5 deg) and deep (28-40 deg) are one camera: going deep is a dolly zoom that
  keeps everything on the target plane the same size while depth opens around it. Every value is a pure function of time
  inside async seek(t); tables built once on load (hand, gestures, the model's app-rule simulation) are looked up only.
  1 world unit = 1 output pixel of the flat layout. Boards stand upright facing the camera over a floor.
-->
<html>
<head>
<meta charset="utf-8" />
<title>swapstudio</title>
<style>html, body { margin: 0; background: #0e0e10; } canvas { display: block; }
  body.preview { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.preview canvas { transform: scale(var(--fit, 0.5)); transform-origin: center; }</style>
<script type="importmap">{ "imports": {
  "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/",
  "troika-three-text": "./node_modules/troika-three-text/dist/troika-three-text.esm.js",
  "troika-three-utils": "./node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
  "troika-worker-utils": "./node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
  "webgl-sdf-generator": "./node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
  "bidi-js": "./node_modules/bidi-js/dist/bidi.mjs" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js'
import { Font } from 'three/addons/loaders/FontLoader.js'
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js'
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'
import { Text } from 'troika-three-text'
import { loadHand, PALM_J } from './hand.js'

const W = 1440, BPM = 120, B = 60 / BPM, BEATS = 120, DUR = BEATS * B
window.SIZE = [W, W]
const COL = { bg: '#0e0e10', panel: '#17171b', panel2: '#212127', panel3: '#2b2b33', text: '#f3efe7', dim: '#8f8b84', faint: '#55535a', accent: '#ff6a2b' }
const FONT = { word: 'assets/fonts/archivo-125-800.ttf', ui: 'assets/fonts/Geist-Regular.ttf', uiM: 'assets/fonts/Geist-Medium.ttf', uiS: 'assets/fonts/Geist-SemiBold.ttf',
  mono: 'assets/fonts/GeistMono-Regular.ttf', monoM: 'assets/fonts/GeistMono-Medium.ttf', serif: 'assets/fonts/InstrumentSerif-Italic.woff' }
const FLOOR = -820

// ---------- time & springs ----------
const at = (beat) => (beat - 1) * B                     // beat n (1-based, as in the beat map) starts here
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x))
const lerp = (a, c, p) => a + (c - a) * p
const smooth = (a, c, x) => { const u = clamp((x - a) / (c - a)); return u * u * (3 - 2 * u) }
const ease = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }
function S(t, f, z) { if (t <= 0) return 0; const w = 2 * Math.PI * f; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t)) }
// a value with many targets = first value + one closed-form spring per change. keys: [beat, value, f?, z?]
const track = (keys, f = 2.4, z = 0.9) => { const d = keys.slice(1).map((k, i) => [at(k[0]), k[1] - keys[i][1], k[2] || f, k[3] ?? z]); return (t) => d.reduce((v, [tk, dv, ff, zz]) => v + dv * S(t - tk, ff, zz), keys[0][1]) }
const on = (t, beat, f = 3, z = 0.85) => S(t - at(beat), f, z)
const pop = (t, beat, f = 3.4) => S(t - at(beat), f, 0.5)             // 0 -> ~1.2 -> 1
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z)
const tiny = (s) => Math.max(1e-4, s)

// ---------- renderer, studio ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, W)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.NeutralToneMapping
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.autoClear = false
renderer.localClippingEnabled = true                          // mask lines clip meshes in their own planes
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
renderer.setClearColor(new THREE.Color(COL.bg), 1)          // not scene.background: that would clear between passes
const camera = new THREE.PerspectiveCamera(0.5, 1, 1, 10)
const key = new THREE.DirectionalLight('#fff4e6', 2.1)
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 1.2
scene.add(key, key.target)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14000, 14000, 40, 40), new THREE.ShadowMaterial({ opacity: 0.42 }))  // subdivided: huge quads mis-clip
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; floor.receiveShadow = true; scene.add(floor)
// overlay pass: output pixels, y up; the corner card and the captions live here so nothing in the scene can hide them
const ov = new THREE.Scene(), ovCam = new THREE.OrthographicCamera(0, W, W, 0, -2000, 2000)

// ---------- flat primitives: SDF panels, troika text ----------
const panelMat = () => new THREE.ShaderMaterial({
  transparent: true, toneMapped: false,
  uniforms: { uSize: { value: new THREE.Vector2(100, 100) }, uR: { value: 16 }, uCol: { value: new THREE.Color(COL.panel) }, uOp: { value: 1 },
    uClip: { value: new THREE.Vector4(-1e9, -1e9, 1e9, 1e9) }, uStroke: { value: 0 }, uProg: { value: 1 }, uDash: { value: 0 } },
  vertexShader: `uniform vec2 uSize; varying vec2 vP; void main(){ vP = position.xy * (uSize + 8.0); gl_Position = projectionMatrix * modelViewMatrix * vec4(vP, 0.0, 1.0); }`,
  fragmentShader: `uniform vec2 uSize; uniform float uR, uOp, uStroke, uProg, uDash; uniform vec3 uCol; uniform vec4 uClip; varying vec2 vP;
    void main(){
      if (vP.x < uClip.x || vP.y < uClip.y || vP.x > uClip.z || vP.y > uClip.w) discard;
      float r = min(uR, 0.5 * min(uSize.x, uSize.y));
      vec2 q = abs(vP) - uSize * 0.5 + r; float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
      float aa = max(fwidth(d), 1e-4), a;
      if (uStroke > 0.0) {
        a = 1.0 - smoothstep(uStroke * 0.5 - aa, uStroke * 0.5 + aa, abs(d + uStroke * 0.5));
        float ang = fract(0.25 - atan(vP.y, vP.x) / 6.2831853);            // 0 at the top, clockwise: the ring draws round
        a *= 1.0 - smoothstep(uProg - 0.004, uProg, ang);
        if (uDash > 0.0) a *= step(0.5, fract((vP.x + vP.y) / uDash));
      } else a = 1.0 - smoothstep(-aa, aa, d);
      if (a < 0.002) discard;
      gl_FragColor = vec4(uCol, a * uOp);
      #include <colorspace_fragment>
    }` })
const QUAD = new THREE.PlaneGeometry(1, 1)
const slabGeo = new Map()
function roundedShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; r = Math.min(r, w / 2, h / 2)
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s }
const managed = []                                          // everything seek() may show; hidden at the start of each frame
function panel({ w = 100, h = 100, r = 16, color = COL.panel, slab = true, stroke = 0, order = 0 } = {}) {
  const g = new THREE.Group(); const face = new THREE.Mesh(QUAD, panelMat()); face.renderOrder = order; g.add(face)
  let body = null
  if (slab) { body = new THREE.Mesh(undefined, new THREE.MeshStandardMaterial({ color, roughness: 0.85 })); body.castShadow = true; body.receiveShadow = true; g.add(body) }
  g.userData.kind = 'panel'
  g.set = (o) => {
    const u = face.material.uniforms
    if (o.w !== undefined || o.h !== undefined) { w = o.w ?? w; h = o.h ?? h }
    if (o.r !== undefined) r = o.r
    u.uSize.value.set(w, h); u.uR.value = r
    if (o.color) { u.uCol.value.set(o.color); if (body) body.material.color.set(o.color) }
    if (o.op !== undefined) u.uOp.value = o.op
    u.uStroke.value = o.stroke ?? stroke; u.uProg.value = o.prog ?? 1; u.uDash.value = o.dash ?? 0
    const c = o.clip; u.uClip.value.set(c ? c[0] : -1e9, c ? c[1] : -1e9, c ? c[2] : 1e9, c ? c[3] : 1e9)
    if (body) {                                              // 4-unit-deep slab behind the face, rebuilt only when its size changes
      const k = `${Math.round(w / 4) * 4}x${Math.round(h / 4) * 4}x${Math.round(r)}`
      if (!slabGeo.has(k)) slabGeo.set(k, new THREE.ExtrudeGeometry(roundedShape(Math.round(w / 4) * 4, Math.round(h / 4) * 4, r), { depth: 4, bevelEnabled: false, curveSegments: 6 }))
      body.geometry = slabGeo.get(k); body.position.z = -4.6; body.visible = !c && (o.op ?? 1) > 0.99 && w > 8 && h > 8
    }
    return g
  }
  g.set({ w, h, r, color })
  scene.add(g); managed.push(g); return g
}
const texts = []
function txt(str, { font = FONT.ui, size = 28, color = COL.text, ax = 'left', ay = 'middle', maxW = Infinity, lh = 1.25, ls = 0, align = 'left', order = 5 } = {}) {
  const t = new Text()
  t.material = new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true })
  Object.assign(t, { text: str, font, fontSize: size, color, anchorX: ax, anchorY: ay, maxWidth: maxW, lineHeight: lh, letterSpacing: ls, textAlign: align })
  t.renderOrder = order; scene.add(t); texts.push(t); managed.push(t); return t
}
// every visible text must finish its sync before a frame is captured (troika drops the callback of a sync() made
// while another is running, so wait for its 'synccomplete' event instead)
const syncOne = (t) => new Promise((r) => {
  if (t._needsSync && !t._isSyncing) return t.sync(r)
  const done = () => { t.removeEventListener('synccomplete', done); r() }
  t.addEventListener('synccomplete', done); if (t._needsSync) t.sync()
})
const syncAll = async () => { for (let k = 0; k < 4; k++) { const ts = texts.filter((t) => t.visible && (t._needsSync || t._isSyncing)); if (!ts.length) return; await Promise.all(ts.map(syncOne)) } }
// a string that swaps through a mask line: the old one leaves upward, the new one rises from below, each clipped to the line
function swapText(a, b, p, lineH) {
  const y = p * lineH * 1.1
  a.position.y = a.userData.y0 + y; a.clipRect = [-1e5, -lineH * 0.6 - y, 1e5, lineH * 0.6 - y]
  b.position.y = b.userData.y0 + y - lineH * 1.1; b.clipRect = [-1e5, -lineH * 0.6 - y + lineH * 1.1, 1e5, lineH * 0.6 - y + lineH * 1.1]
  a.visible = p < 0.999; b.visible = p > 0.001
}

// ---------- one camera: target, direction, framed height, field of view ----------
// direction: yaw about world up, elevation above the horizontal; position = target + dir * H / (2 tan(fov/2)).
// fov runs on L = log(tan(fov/2)) so a crossing is a dolly zoom: the target plane keeps its size to the pixel.
const Lof = (deg) => Math.log(Math.tan((deg * Math.PI) / 360)), FLAT = Lof(0.5)
function applyCam({ T, yaw, el, H, L }) {
  const fov = 2 * Math.atan(Math.exp(L)), dist = H / (2 * Math.tan(fov / 2))
  const dir = V(Math.cos(el) * Math.sin(yaw), Math.sin(el), Math.cos(el) * Math.cos(yaw))
  camera.quaternion.setFromEuler(new THREE.Euler(-el, yaw, 0, 'YXZ'))
  camera.position.copy(T).addScaledVector(dir, dist)
  camera.fov = (fov * 180) / Math.PI
  const R = 4200 + H * 1.5                                    // near and far hug the scene around the target every frame
  camera.near = Math.max(40, dist - R); camera.far = dist + R; camera.updateProjectionMatrix(); camera.updateMatrixWorld()
  floor.position.x = T.x; floor.position.z = T.z                     // the floor follows the target (it only shows shadows)
  key.target.position.copy(T); key.position.copy(T).add(V(900, 2400, 2600))
  const sc = key.shadow.camera, e = Math.max(900, H * 1.1); sc.left = -e; sc.right = e; sc.top = e; sc.bottom = -e; sc.near = 200; sc.far = 9000; sc.updateProjectionMatrix()
  return { fov, dist }
}
// world point -> output pixels (y up), for handing a card from the scene to the overlay on the exact frame
const toPx = (v) => { const p = v.clone().project(camera); return V((p.x + 1) * W / 2, (p.y + 1) * W / 2, 0) }


// ================= models: the model itself, squashed flat when it must look like a picture =================
// Squash along a world normal in the vertex shader (positions only: normals untouched, so a flat model still shades
// like its thumbnail), with the same squash in the shadow depth material so its shadow is flat too.
const MODELS = {}                                          // name -> normalised prototype (bounding-sphere diameter 1)
const SQ_VS = `vec4 wq = modelMatrix * vec4(transformed, 1.0); wq.xyz -= uSqN * dot(wq.xyz - uSqC, uSqN) * (1.0 - uSq);
  vec4 mvPosition = viewMatrix * wq; gl_Position = projectionMatrix * mvPosition;`
function squashable(mat, U) {
  mat.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, U); sh.vertexShader = 'uniform float uSq; uniform vec3 uSqN; uniform vec3 uSqC;\n' + sh.vertexShader.replace('#include <project_vertex>', SQ_VS) }
  mat.customProgramCacheKey = () => 'squash'
  return mat
}
async function loadModels() {
  const gl = new GLTFLoader()
  for (let k = 1; k <= 6; k++) {
    const g = await gl.loadAsync(`assets/models/m${k}.glb`), o = g.scene
    const box = new THREE.Box3().setFromObject(o), c = box.getCenter(V()), r = box.getBoundingSphere(new THREE.Sphere()).radius
    o.position.sub(c); const wrap = new THREE.Group(); wrap.add(o); wrap.scale.setScalar(0.5 / r)   // centred, diameter 1
    MODELS['m' + k] = wrap
  }
}
function modelInstance(name) {
  const U = { uSq: { value: 1 }, uSqN: { value: V(0, 0, 1) }, uSqC: { value: V() } }
  const inner = SkeletonUtils.clone(MODELS[name]), root = new THREE.Group(); root.add(inner)
  inner.traverse((m) => {
    if (!m.isMesh) return
    m.material = squashable(m.material.clone(), U); m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false
    m.customDepthMaterial = squashable(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), U)
  })
  scene.add(root); managed.push(root)
  // place(centre, diameter, quaternion, squash 0..1 along normal n through point c)
  root.place = (p, d, q, sq = 1, n = V(0, 0, 1), c = p) => {
    root.visible = d > 0.5; root.position.copy(p); root.scale.setScalar(Math.max(1e-3, d)); root.quaternion.copy(q)
    U.uSq.value = Math.max(0.002, sq); U.uSqN.value.copy(n); U.uSqC.value.copy(c)
  }
  return root
}
const qEuler = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler((x * Math.PI) / 180, (y * Math.PI) / 180, (z * Math.PI) / 180, 'YXZ'))
const Q_THUMB = qEuler(12, -30, 0)                          // the app's thumbnail angle: seen from 12 deg above, turned 30 deg


// Open, Build and Start were first timed on the 80-beat grid; NB maps those beats onto the one-minute grid (monotonic,
// piecewise linear) and OB maps back, so their moments keep their order while the film breathes to 120 beats.
const REMAP = [[1, 1], [1.6, 1.8], [2.5, 3.2], [3.05, 4.2], [4.55, 7.4], [5, 9], [7, 13], [8, 15], [9, 17], [10, 18.6], [11, 21], [13, 24], [14, 25.5], [15, 27],
  [16.9, 28.9], [17, 29], [18, 30.5], [20, 33.5], [22, 36.2], [23, 37.4], [26, 40.6], [27, 41.4], [28, 43], [29, 45], [200, 216]]
const pw = (x, A, Bc) => { for (let i = 1; i < REMAP.length; i++) { const a = REMAP[i - 1], c = REMAP[i]; if (x <= c[A] || i === REMAP.length - 1) return a[Bc] + (x - a[A]) * (c[Bc] - a[Bc]) / (c[A] - a[A]) } }
const NB = (x) => pw(x, 0, 1), OB = (x) => pw(x, 1, 0)

// ---------- data ----------
let facts, plan, hand, voice, sim = {}
const Q = () => facts.maker_quotes.lines

// ---------- build ----------
const E = {}                                                // every element, by name
async function build() {
  ;[facts, plan, voice] = await Promise.all(['data/facts.json', 'data/plan.json', 'audio/voice/voice.json'].map((u) => fetch(u).then((r) => r.json())))
  hand = await loadHand('data/hand_motion.json')
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromEquirectangular(await new RGBELoader().loadAsync('assets/hdri/monochrome_studio_02_1k.hdr')).texture
  scene.environmentIntensity = 0.32
  await loadModels()
  buildOpenBuild()
  await buildWords()
  await buildStart()
  window.__touches = await fetch('data/touches.json').then((r) => r.json())
  buildLive()
  await buildCaptions()
}

// ================= OPEN + BUILD (flat) =================
let digitFont
function buildOpenBuild() {
  // wordmark: one text per letter so the squeeze can move them; the period becomes the chat pill
  E.word = [...'swapstudio.'].map((ch) => txt(ch, { font: FONT.word, size: 150, ax: 'left', ay: 'middle', order: 8 }))
  E.pill = panel({ w: 40, h: 40, r: 6, color: COL.text, slab: false, order: 7 })
  E.pillText = txt('', { size: 34, color: '#141416', ax: 'left', ay: 'middle', order: 9 })
  E.caret = panel({ w: 3, h: 40, r: 1, color: '#141416', slab: false, order: 9 })
  E.chat = panel({ w: 1240, h: 1200, r: 16, color: COL.panel, order: 1 })
  E.chatHead = txt('Built in Claude Code', { font: FONT.uiS, size: 30 })
  E.bubbles = [0, 1, 2, 3, 4, 5, 6].map(() => ({ box: panel({ w: 200, h: 60, r: 22, color: COL.panel3, slab: false, order: 3 }), t: txt('', { size: 26, maxW: 640, order: 4 }) }))
  E.agents = ['builder', 'builder', 'reviewer', 'reviewer', 'harsh judge'].map((n) => ({ box: panel({ w: 470, h: 52, r: 12, color: COL.panel2, slab: false, order: 3 }),
    dot: panel({ w: 12, h: 12, r: 6, color: COL.dim, slab: false, order: 4 }), t: txt(n, { size: 24, order: 4 }) }))
  E.term = panel({ w: 760, h: 330, r: 16, color: '#101013', order: 2 })
  E.termLine = txt('', { font: FONT.mono, size: 24, color: COL.dim, order: 4 })
  E.speedLine = txt('', { font: FONT.mono, size: 17, color: COL.dim, maxW: 700, lh: 1.45, order: 4 })
  E.fpsUnit = txt('fps', { font: FONT.uiM, size: 40, color: COL.dim, order: 4 })
  E.dotsCard = panel({ w: 380, h: 330, r: 16, color: '#101013', order: 2 })
  E.dotsDots = Array.from({ length: 21 }, () => panel({ w: 9, h: 9, r: 4.5, color: COL.text, slab: false, order: 4 }))
  E.chipsLabel = txt('harsh judge, out of 10', { size: 22, color: COL.dim })
  E.chips = facts.making_of.judge_out_of_10.map((v) => ({ box: panel({ w: 112, h: 58, r: 29, color: COL.panel2, slab: false, order: 3 }), t: txt(String(v), { font: FONT.uiS, size: 28, ax: 'center', order: 4 }) }))
  E.bigChip = panel({ w: 300, h: 76, r: 38, color: COL.panel2, slab: false, order: 3 })
  E.bigA = txt(`${facts.making_of.judge_out_of_10.at(-1)} / 10`, { font: FONT.uiS, size: 34, ax: 'center', order: 4 })
  E.bigB = txt(`${facts.making_of.judge_out_of_1000_first_round} / 1000`, { font: FONT.uiS, size: 34, ax: 'center', order: 4 })
  E.bigC = txt(`${facts.making_of.judge_out_of_1000_second_round} / 1000`, { font: FONT.uiS, size: 34, ax: 'center', order: 4 })
  E.bigLabel = txt('first round', { size: 22, color: COL.dim, ax: 'right' }); E.bigLabel2 = txt('second round', { size: 22, color: COL.dim, ax: 'right' })
  E.launcher = panel({ w: 150, h: 150, r: 34, color: COL.panel3, order: 3 })
  E.launchMark = panel({ w: 64, h: 64, r: 32, color: COL.text, slab: false, order: 4 })
  E.launchLabel = txt('Open Studio', { font: FONT.uiM, size: 26, ax: 'center', order: 4 })
  E.cursor = makeCursor()
  // the speed number: extruded digits whose depth is a spring (0.2% while flat), swapped through a mask line
  digitFont = null
}
function makeCursor() {                                       // a plain arrow, drawn once as a shape (not any OS's cursor art)
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(0, -38); s.lineTo(10, -28); s.lineTo(18, -44); s.lineTo(24, -41); s.lineTo(16, -26); s.lineTo(30, -26); s.lineTo(0, 0)
  const g = new THREE.Group()
  const edge = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color: '#0b0b0d', toneMapped: false })); edge.scale.setScalar(1.18); edge.position.set(-2, 2, 0)
  const fill = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color: COL.text, toneMapped: false })); fill.position.z = 0.5
  edge.renderOrder = 20; fill.renderOrder = 21; g.add(edge, fill); scene.add(g); managed.push(g); return g
}
function tickMark(color, size, order = 6) {                   // a drawn tick (the UI fonts have no check glyph)
  const s = new THREE.Shape(); s.moveTo(-0.5, 0.05); s.lineTo(-0.36, 0.2); s.lineTo(-0.12, -0.05); s.lineTo(0.38, 0.45); s.lineTo(0.52, 0.31); s.lineTo(-0.12, -0.33); s.lineTo(-0.5, 0.05)
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color, toneMapped: false })); m.geometry.scale(size, size, 1); m.renderOrder = order
  scene.add(m); managed.push(m); return m
}

function standIn(label, sub, tag) {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720; const g = c.getContext('2d')
  g.fillStyle = '#18181c'; g.fillRect(0, 0, 1280, 720); g.strokeStyle = '#222228'; g.lineWidth = 2
  for (let x = 0; x <= 1280; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 720); g.stroke() }
  for (let y = 0; y <= 720; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(1280, y); g.stroke() }
  g.fillStyle = '#6d6a66'; g.font = '500 34px Geist, sans-serif'; g.textAlign = 'center'; g.fillText(label, 640, 350); g.font = '400 22px monospace'; g.fillText(sub, 640, 395)
  if (tag) drawTag(g, 1280, 720)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t
}
// the app's tag (faceswap/outputs/virtualcam.py draw_badge): white "AI effect" on a rounded rgb(20,20,20) box at 60%,
// bottom-left, text 3% of the picture height, margin 2%
function drawTag(g, w, h) {
  const fs = Math.max(12, h * 0.03), m = h * 0.02; g.font = `500 ${fs}px Geist, sans-serif`
  const tw = g.measureText('AI effect').width, pw = tw + fs * 0.9, ph = fs * 1.6
  g.fillStyle = 'rgba(20,20,20,0.6)'; g.beginPath(); g.roundRect(m, h - m - ph, pw, ph, ph * 0.28); g.fill()
  g.fillStyle = '#ffffff'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('AI effect', m + fs * 0.45, h - m - ph / 2)
}

function callScene(t, b, cs) {
  // ---- 101: the studio presses flat behind the corner card, which grows to fill the frame, then becomes one call tile ----
  const g = ease((b - 101) / 0.8), toTile = ease((b - 102) / 0.7), CORNER = { x: W - 40 - 190, y: W - 40 - 107, w: 380, h: 214 }
  const TILEW = 440, TILEH = 248, GAP = 24
  const grid = [[-1, 0.5], [0, 0.5], [1, 0.5], [-1, -0.5], [0, -0.5], [1, -0.5]], MAIN = 1
  const close = ease((b - 113) / 0.7)
  if (b < 102) {                                                  // overlay: corner card -> full frame
    cornerCard(t, b, { x: lerp(CORNER.x, W / 2, g), y: lerp(CORNER.y, W / 2, g), w: lerp(CORNER.w, W * 1.02, g), h: lerp(CORNER.h, W * 1.02, g) }, 1)
    if (g > 0.999) { E.callBg.visible = true; E.callBg.position.set(cs.T.x, cs.T.y, 600) }
    return
  }
  E.callBg.visible = b < 114.3; E.callBg.position.set(0, 0, 600); E.callBg.set({ w: 3000, h: 3000, r: 0 })
  // the main tile: full frame -> its grid place (the camera is flat and framed on the grid from here)
  const [gx, gy] = grid[MAIN], mx = gx * (TILEW + GAP), my = gy * (TILEH + GAP) * 2 * 0.5 + 60
  const shrink = ease((b - 113) / 0.6), toDot = ease((b - 113.6) / 0.6)
  let w = lerp(1440, TILEW, toTile), h = lerp(1440, TILEH, toTile), x = lerp(0, mx, toTile), y = lerp(0, my, toTile)
  if (b >= 113) { x = lerp(mx, 0, shrink); y = lerp(my, 0, shrink); w = lerp(TILEW, 30, toDot); h = lerp(TILEH, 30, toDot) }
  // 105: the tile's clip pushes to my hand passing in front of the swapped face
  const n = b >= 105 ? 5 : 4
  E.mainTile.visible = true; E.mainTile.position.set(x, y, 610); E.mainTile.set({ w, h, r: lerp(0, 16, toTile) })
  E.mainImg.visible = w > 60; E.mainImg.material.map = E.liveTex[n]; E.mainImg.position.set(x, y, 611); E.mainImg.scale.set(w, h, 1)
  if (b >= 114.2) { E.mainTile.visible = E.mainImg.visible = false }
  // 102: the other tiles unfold from behind it like a paper map, initials only
  E.callTiles.forEach((tl, k) => {
    const gi = [0, 2, 3, 4, 5][k], [tx, ty] = grid[gi], unf = ease((b - 102.4 - k * 0.12) / 0.5) * (1 - ease((b - 113 + k * 0.05) / 0.45))
    if (unf < 0.001) return
    const px = lerp(mx, tx * (TILEW + GAP), unf), py = lerp(my, ty * (TILEH + GAP) + 60, unf)
    tl.box.visible = tl.av.visible = tl.t.visible = true
    tl.box.position.set(px, py, 605); tl.box.scale.set(tiny(unf), 1, 1); tl.av.position.set(px, py + 10, 606); tl.av.scale.setScalar(tiny(unf)); tl.t.position.set(px, py + 10, 607); tl.t.scale.setScalar(tiny(unf))
  })
  if (b >= 113) return
  // 103..104: the cursor opens the camera menu and picks "OBS Virtual Camera"; a tick draws itself
  const bx = mx, by = my - TILEH / 2 - 60, mo = on(t, 103, 3, 0.8)
  place(E.camBtn, bx, by, 620, pop(t, 102.8, 3)); place(E.camBtnT, bx, by, 621, pop(t, 102.8, 3))
  if (mo > 0.01) {
    E.menu.visible = true; E.menu.position.set(bx, by - 100 * mo, 622); E.menu.scale.set(1, tiny(mo), 1)
    E.menuItems.forEach((it, k) => place(it, bx - 160, by - 70 * mo - k * 56 * mo + 10, 624, 1))
    if (b > 103.8) { E.menuHl.visible = true; E.menuHl.position.set(bx, by - 70 * mo - 56 * mo + 10, 623) }
    if (b > 104.1) place(E.menuTick, bx + 150, by - 70 * mo - 56 * mo + 10, 625, clamp((b - 104.1) / 0.3))
  }
  const cur = E.cursor; cur.visible = b > 102.6; const cp = ease((b - 102.6) / 0.6), cp2 = ease((b - 103.4) / 0.4)
  cur.position.set(lerp(bx + 300, bx + 10, cp) - 60 * cp2, lerp(by - 200, by - 6, cp) - 120 * cp2, 630)
  // 105: "Hands stay in front of the face"; 107: zoom onto the AI effect tag; 108: the lock chip
  if (b >= 105.2) place(E.hands, mx - TILEW / 2, my + TILEH / 2 + 50, 620, pop(t, 105.2, 3))
  if (b >= 108) { place(E.lock, 0, -470, 620, pop(t, 108, 3)); place(E.lockT, 0, -470, 621, pop(t, 108, 3)) }
}

// ================= captions: the voice, word by word (the reference's kinetic type) =================
// Each spoken line is set in Geist SemiBold with one word in Instrument Serif italic, accent orange. Words rise through a
// mask line as they are said (times spread over the line's measured length by syllables and pauses) and leave upward
// through it when the next line starts. Drawn in the overlay pass, bottom-left.
const EMPH = { 'message.': 1, 'judge.': 1, 'six': 1, 'thirty.': 1, 'thousand:': 1, 'face.': 1, 'model.': 1, 'Start': 1, 'Live': 1, 'Thirty': 1, 'hand.': 1, 'Pinch:': 1,
  'zero': 1, 'apart.': 1, 'hundred': 1, 'grows,': 1, 'faces': 1, 'shelf': 1, 'resists,': 1, 'pops': 1, 'virtual': 1, 'front': 1, 'MacBook': 1, 'Nothing': 1 }
const CAP = { x: 72, y: 92, size: 50, maxW: 1100, lh: 68 }
const syl = (w) => Math.max(1, (w.toLowerCase().replace(/[^a-z]/g, '').match(/[aeiouy]+/g) || []).length) + (/[,.:]$/.test(w) ? 0.8 : 0)
async function buildCaptions() {
  E.caps = []
  for (const v of voice) {
    if (v.line === 'swapstudio.') continue
    const words = v.line.split(' ')
    const ws = words.map((w) => { const em = EMPH[w] && !E.caps.some((c) => c.words.some((x) => x.em)) || EMPH[w]; return { w, em: !!EMPH[w],
      t: (() => { const tx = new Text(); tx.material = new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true })
        Object.assign(tx, { text: w, font: EMPH[w] ? FONT.serif : FONT.uiS, fontSize: EMPH[w] ? CAP.size * 1.3 : CAP.size, color: EMPH[w] ? COL.accent : COL.text, anchorX: 'left', anchorY: 'bottom-baseline' })
        tx.renderOrder = 100; ov.add(tx); texts.push(tx); managed.push(tx); tx.visible = true; return tx })() } })
    E.caps.push({ v, words: ws })
  }
  await syncAll()
  for (const c of E.caps) {
    // wrap into lines from the bottom-left, then time each word by its share of the syllables
    let x = 0, row = 0; const space = CAP.size * 0.28
    c.words.forEach((w) => { const bb = w.t.textRenderInfo.blockBounds, wd = bb[2] - bb[0]; if (x > 0 && x + wd > CAP.maxW) { x = 0; row++ } w.x = x; w.row = row; x += wd + space })
    c.rows = row + 1
    const total = c.words.reduce((a, w) => a + syl(w.w), 0), speech = Math.max(0.3, c.v.len - c.v.lead - 0.1)
    let acc = 0; c.words.forEach((w) => { w.at = c.v.t + (acc / total) * speech; acc += syl(w.w) })
    c.words.forEach((w) => (w.t.visible = false))
  }
  E.caps.forEach((c, k) => (c.out = k + 1 < E.caps.length ? Math.min(E.caps[k + 1].v.t - 0.32, c.v.t + c.v.len + 1.2) : c.v.t + c.v.len + 1))
}
function captions(t) {
  for (const c of E.caps) {
    if (t < c.v.t - 0.05 || t > c.out + 0.4) continue
    const leave = ease((t - c.out) / 0.3)
    c.words.forEach((w) => {
      const rise = ease((t - w.at) / 0.18); if (rise <= 0) return
      const baseY = CAP.y + (c.rows - 1 - w.row) * CAP.lh, y = baseY - (1 - rise) * CAP.lh * 0.8 + leave * CAP.lh * 0.8
      w.t.visible = true; w.t.position.set(CAP.x + w.x, y, 0)
      // the mask line: each row shows only inside its own band (planes in overlay pixels)
      const pl = w.t.material.clippingPlanes || (w.t.material.clippingPlanes = [new THREE.Plane(), new THREE.Plane()])
      pl[0].set(V(0, 1, 0), -(baseY - CAP.size * 0.42)); pl[1].set(V(0, -1, 0), baseY + CAP.size * 1.25)
    })
  }
}

const CHAT = { x: 0, y: 0, w: 1240, h: 1200 }
async function seek(tIn) {
  const t = clamp(tIn, 0, DUR - 1e-6), b = t / B + 1
  managed.forEach((m) => (m.visible = false))
  const cs = camAt(t); const lens = clamp((cs.L - FLAT) / (Lof(34) - FLAT), 0, 1.2)
  applyCam(cs)
  if (b < NB(17.6)) openBuild(t, b, lens)
  if (b >= NB(16.9) && b < NB(29.4)) startScene(t, b, lens)
  if (b >= 45 && b < 101.05) liveScene(t, b, cs, lens)
  if (b >= 101) callScene(t, b, cs)
  if (b >= 113.4) closeScene(t, b)
  captions(t)
  await syncAll()

  renderer.clear(); camera.layers.set(0); renderer.render(scene, camera)
  renderer.clearDepth(); camera.layers.set(2); renderer.render(scene, camera); camera.layers.set(0)
  renderer.clearDepth(); renderer.render(ov, ovCam)
}

function openBuild(t, b, lens) {
  const ob = OB(b)

  const f = 1 - ease((ob - 1.6) / 0.9), slide = ease((ob - 1.6) / 0.9)
  const x0 = -E.wordTotal / 2
  let acc = 0; const px = []; E.word.forEach((_, i) => { px.push(x0 + acc); acc += E.wordAdv[i] })
  const pIdx = E.word.length - 1, pX = px[pIdx], pW = E.wordW[pIdx]
  const shift = -(pX + pW / 2) * slide
  E.word.forEach((m, i) => {
    if (ob >= 2.6) return
    m.visible = i === pIdx || f > 0.004
    m.position.set(pX + (px[i] - pX) * f + shift, 0, 1)
    m.scale.set(i === pIdx ? 1 : tiny(f), 1, 1)
  })
  // ---- the period stretches into the chat input pill (2.5..3), then my first message types into it ----
  const grow = ease((ob - 2.5) / 0.6)
  const lift = on(t, NB(5), 2.2, 0.9)                             // beat 5: the pill lifts into a bubble
  if (ob >= 2.5 && ob < 17.2) {
    const pillW = lerp(pW, 1180, grow), pillH = lerp(pW * 1.02, 96, grow)
    const bubble = E.bubbles[0]
    const q = Q()[0], typed = q.slice(0, Math.round(clamp((ob - 3.05) / 1.5) * q.length))
    if (lift < 0.002) {
      E.pill.visible = true; E.pill.position.set(0, E.word[pIdx].userData.dotY ?? -pW * 0.05, 2); E.pill.set({ w: pillW, h: pillH, r: lerp(3, 48, grow), color: COL.text })
      E.pillText.visible = grow > 0.99 && typed.length > 0; E.pillText.text = typed; E.pillText.position.set(-560, 0, 3)
      E.caret.visible = grow > 0.99 && Math.floor(t * 4) % 2 === 0; E.caret.position.set(-560 + typed.length * 16.4 + 6, 0, 3)
    }
    // ---- beat 5: the pill becomes my bubble and the chat panel grows round it ----
    if (lift >= 0.002) {
      const bw = 700, bh = 110, tx = CHAT.w / 2 - 40 - bw / 2, ty = CHAT.h / 2 - 150
      E.pill.visible = true; E.pill.position.set(lerp(0, tx, lift), lerp(0, ty, lift), 3)
      E.pill.set({ w: lerp(1180, bw, lift), h: lerp(96, bh, lift), r: lerp(48, 24, lift), color: new THREE.Color(COL.text).lerp(new THREE.Color(COL.panel3), clamp(lift * 1.4)) })
      E.pillText.visible = true; E.pillText.text = q; E.pillText.maxWidth = lerp(1200, 640, lift); E.pillText.color = new THREE.Color('#141416').lerp(new THREE.Color(COL.text), clamp(lift * 1.4))
      E.pillText.position.set(lerp(-560, tx - bw / 2 + 28, lift), lerp(0, ty, lift), 4)
      const cg = on(t, NB(5), 1.8, 0.95)
      E.chat.visible = true; E.chat.position.set(0, 0, 0); E.chat.set({ w: lerp(bw, CHAT.w, cg), h: lerp(bh, CHAT.h, cg) })
      E.chatHead.visible = cg > 0.6; E.chatHead.position.set(-CHAT.w / 2 + 44, CHAT.h / 2 - 56, 1); E.chatHead.clipRect = [-1e4, -1e4, 1e4, 1e4]
      // helper agents pop in as rows, one per eighth
      E.agents.forEach((a, k) => {
        const s = pop(t, NB(5.5 + k * 0.5), 3.4); if (s < 0.01) return
        const y = CHAT.h / 2 - 270 - k * 58, x = -CHAT.w / 2 + 44 + 235
        a.box.visible = a.dot.visible = a.t.visible = true
        a.box.position.set(x, y, 1); a.box.scale.setScalar(tiny(s))
        a.dot.position.set(x - 205 * s, y, 2); a.dot.scale.setScalar(tiny(s)); a.t.position.set(x - 184 * s, y, 2); a.t.scale.setScalar(tiny(s))
      })
    }
  }
  // ---- 7-8: the early speed, and my hand's 21 dots redrawn only 7.7 times a second ----
  const tm = pop(t, NB(7), 2.6), speed7 = 7.7
  if (tm > 0.01) {
    const X = -CHAT.w / 2 + 44 + 380, Y = -120
    E.term.visible = true; E.term.position.set(X, Y, 1); E.term.scale.setScalar(tiny(tm))
    const line = 'an early logged session: 7.7 fps'
    E.termLine.visible = true; E.termLine.text = '> ' + line.slice(0, Math.round(clamp((ob - 7.1) / 0.8) * line.length)); E.termLine.position.set(X - 350, Y + 125, 2)
    // the big number: 7.7 swaps to 30 through a mask line on beat 9, its depth a spring (0.2% while flat)
    const sw = ease((ob - 9) / 0.35), depth = lerp(0.002, 1, clamp(lens))
    const turn = (20 * Math.PI / 180) * clamp(lens)
    for (const [s, p] of [['7.7', 1 - sw], ['30', sw]]) {
      const m = E.num[s]; if (!m || p < 0.001 || ob < 7.6) continue
      m.visible = true; m.scale.set(tm, tm, depth)
      const yoff = (s === '7.7' ? sw : sw - 1) * 170
      m.position.set(X - 150, Y + 5 + yoff, 3 + Math.sin(turn) * 170 * tm); m.rotation.set(0, turn, 0)
      // mask line: clip each number to the terminal's number window
      m.material.clippingPlanes = [new THREE.Plane(V(0, -1, 0), Y + 5 + 95), new THREE.Plane(V(0, 1, 0), -(Y + 5 - 95))]
    }
    E.fpsUnit.visible = ob > 7.6; E.fpsUnit.position.set(X + 40, Y - 30, 2)
    // the real speed line types out under the digits as they press flat again (beat 10)
    const rl = facts.speed.real_speed_line
    E.speedLine.visible = ob > 10; E.speedLine.text = rl.slice(0, Math.round(clamp((ob - 10) / 1.2) * rl.length)); E.speedLine.position.set(X - 350, Y - 105, 2); E.speedLine.anchorY = 'top'
    // dots card: my hand's picture joints, redrawn 7.7 times a second until beat 9, then on every frame
    const DX = CHAT.w / 2 - 44 - 190, dc = E.dotsCard
    dc.visible = true; dc.position.set(DX, Y, 1); dc.scale.setScalar(tiny(tm))
    const rate = ob < 9 ? speed7 : 30
    const c = 1.6 + Math.floor((t - at(NB(7))) * rate) / rate * (rate === 30 ? 1 : 1)
    const i = hand.nearest(hand.frameOf(c)), P = hand.pic[i]
    const cx = P.reduce((a, p) => a + p[0], 0) / 21, cy = P.reduce((a, p) => a + p[1], 0) / 21
    E.dotsDots.forEach((d, j) => { d.visible = true; d.position.set(DX + (P[j][0] - cx) * 0.42 * tm, Y - (P[j][1] - cy) * 0.42 * tm, 2); d.scale.setScalar(tiny(tm)) })
  }
  // bubbles: my messages, exactly as typed
  const bub = (k, qi, beat, y) => {
    const s = pop(t, NB(beat), 3.2); if (s < 0.01) return
    const e = E.bubbles[k], q = Q()[qi]; e.t.text = q; e.t.maxWidth = 520
    const lines = Math.ceil(q.length / 34), bw = Math.min(560, 40 + q.length * 13.2), bh = 34 + lines * 33
    const x = CHAT.w / 2 - 44 - bw / 2
    e.box.visible = e.t.visible = true; e.box.position.set(x, y, 2); e.box.set({ w: bw, h: bh, r: 22, color: COL.panel3 }); e.box.scale.setScalar(tiny(s))
    e.t.position.set(x - bw / 2 + 22, y, 3); e.t.scale.setScalar(tiny(s))
  }
  bub(1, 1, 8, CHAT.h / 2 - 280); bub(2, 2, 8.5, CHAT.h / 2 - 380); bub(3, 6, 13, -440)
  // judge chips: one per sixteenth
  const cl = pop(t, NB(11), 3)
  if (cl > 0.01) { E.chipsLabel.visible = true; E.chipsLabel.position.set(-CHAT.w / 2 + 44, -305, 1) }
  E.chips.forEach((c, k) => {
    const s = pop(t, NB(11 + k * 0.25), 3.6); if (s < 0.01) return
    const x = -CHAT.w / 2 + 44 + 56 + k * 124, y = -360
    c.box.visible = c.t.visible = true; c.box.position.set(x, y, 1); c.box.scale.setScalar(tiny(s)); c.t.position.set(x, y, 2); c.t.scale.setScalar(tiny(s))
  })
  const bc = pop(t, NB(13.5), 3)
  if (bc > 0.01) {
    const x = CHAT.w / 2 - 44 - 150, y = -545
    E.bigChip.visible = true; E.bigChip.position.set(x, y, 1); E.bigChip.scale.setScalar(tiny(bc))
    for (const e of [E.bigA, E.bigB, E.bigC]) { e.userData.y0 = y; e.position.x = x; e.position.z = 2 }
    // 9.7 / 10 -> 373 / 1000 (first round) -> 578 / 1000 (second round), each through the chip's mask line
    const s2 = ease((ob - 14.6) / 0.3)
    if (s2 <= 0) swapText(E.bigA, E.bigB, ease((ob - 14) / 0.35), 40); else swapText(E.bigB, E.bigC, s2, 40)
    for (const e of [E.bigLabel, E.bigLabel2]) { e.userData.y0 = y; e.position.x = x - 170; e.position.z = 1 }
    if (ob > 14) swapText(E.bigLabel, E.bigLabel2, s2, 28); E.bigLabel.clipRect = E.bigLabel.clipRect.map((v, i) => (i % 2 ? v : i ? 10 : -300)); E.bigLabel2.clipRect = E.bigLabel2.clipRect.map((v, i) => (i % 2 ? v : i ? 10 : -300))
  }
  // the last reply: a double-click launcher; the cursor double-clicks it (15.5, 15.75)
  const ls = pop(t, NB(15), 3)
  if (ls > 0.01) {
    const x = -CHAT.w / 2 + 44 + 75, y = -CHAT.h / 2 + 95
    const press = 1 - 0.06 * (Math.exp(-Math.max(0, t - at(NB(15.6))) * 18) * (ob > 15.6) + Math.exp(-Math.max(0, t - at(NB(15.85))) * 18) * (ob > 15.85))
    E.launcher.visible = E.launchMark.visible = true; E.launcher.position.set(x, y, 2); E.launcher.scale.setScalar(tiny(ls * press)); E.launchMark.position.set(x, y, 3); E.launchMark.scale.setScalar(tiny(ls * press))
    E.launchLabel.visible = true; E.launchLabel.position.set(x + 190, y, 3)
    const cur = E.cursor; cur.visible = ob > 14.8
    const k = ease((ob - 14.8) / 0.7); cur.position.set(lerp(x + 420, x + 8, k), lerp(y - 260, y - 8, k), 10)
  }
}

// ---------- timeline & boot ----------
window.seek = seek
window.__pending = () => texts.filter((t) => t.visible && (t._needsSync || t._isSyncing)).map((t) => JSON.stringify([t.text, t._needsSync, t._isSyncing])).join(' | ')
window.__camPath = () => { const out = []; for (let b = 1; b <= 121; b += 0.125) { const c = camAt(at(b)); applyCam(c); out.push([b, camera.position.x, camera.position.z, c.T.x, c.T.z, camera.fov]) } return out }
window.__cam = () => JSON.stringify([camera.position.toArray().map(Math.round), camera.near, camera.far, camera.fov])
window.__vis = () => { const out = []; scene.traverseVisible((o) => { if (!o.isMesh) return; const b = new THREE.Box3().setFromObject(o); const s = b.getSize(V()); if (s.x > 1500 || s.y > 1500) out.push([o.type, o.material.type, o.renderOrder, s.toArray().map(Math.round), b.getCenter(V()).toArray().map(Math.round)]) }); return JSON.stringify(out) }
window.timeline = () => ({ duration: DUR, bpm: BPM, beat: B, cues: cues(), voice: voice.map((v) => ({ file: `audio/voice/${String(v.n).padStart(2, '0')}.wav`, t: v.t, lead: v.lead })) })
await build()
// warm-up: the first frame after load has no shadow map yet (ShadowMaterial reads garbage), so render one before ready
await seek(at(58)); await seek(at(58))
window.ready = true
const params = new URLSearchParams(location.search)
if (params.has('t')) await seek(+params.get('t'))
else if (!window.__RENDER__) { document.body.classList.add('preview'); const t0 = performance.now(); const loop = async () => { await seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop) }; loop() }
</script>
